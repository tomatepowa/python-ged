<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}GED DSI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ version_statique }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}?v={{ version_statique }}">
</head>
<body>
  <header class="bandeau">
    <a class="logo" href="/">GED <span>DSI</span></a>
    <nav>
      <a href="/">Recherche</a>
      {% if request.state.lecteur.admin %}<a href="/stats">État de l'index</a>{% endif %}
    </nav>
    {% if request.state.lecteur.compte %}<a class="compte" href="/moi" title="Documents affichés selon vos droits Windows : voir vos groupes">{{ request.state.lecteur.compte }}{% if request.state.lecteur.admin %} · admin{% endif %}</a>{% endif %}
  </header>
  <main>
    {% block contenu %}{% endblock %}
  </main>
  <script>
    // Ajout d'un tag (administrateurs) : choisir un tag existant remplit sa catégorie
    document.addEventListener('input', (e) => {
      const libelle = e.target.closest('[data-libelle-tag]');
      if (!libelle) return;
      const option = [...(libelle.list?.options || [])].find((o) => o.value === libelle.value);
      const categorie = libelle.parentElement.querySelector('input[name=categorie]');
      if (option && categorie) categorie.value = option.dataset.categorie;
    });
    // Copie du chemin réseau, à coller dans l'explorateur Windows
    document.addEventListener('click', async (e) => {
      const bouton = e.target.closest('[data-copier]');
      if (!bouton) return;
      try {
        await navigator.clipboard.writeText(bouton.dataset.copier);
        const libelle = bouton.textContent;
        bouton.textContent = 'Copié ✓';
        setTimeout(() => { bouton.textContent = libelle; }, 1500);
      } catch { window.prompt('Copiez le chemin :', bouton.dataset.copier); }
    });
  </script>
</body>
</html>
