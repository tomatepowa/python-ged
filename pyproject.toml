[project]
name = "ged-dsi"
version = "0.1.0"
description = "GED légère en lecture seule : indexe les partages réseau existants et rend les notes techniques trouvables."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pymupdf>=1.24",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.scripts]
ged = "ged.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ged"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Erreurs, syntaxe Python récente, bugs probables, simplifications (pas le tri des imports :
# il mettrait un nom par ligne dans les imports groupés)
select = ["E", "F", "W", "UP", "B", "SIM"]
ignore = [
    "E501",  # quelques lignes longues (requêtes SQL, messages) restent plus lisibles d'un bloc
    "SIM905",  # listes de mots écrites en texte puis découpées (.split()) : plus lisibles
    "B008",  # Depends()/Query() en valeur par défaut : usage normal de FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Query() = [] : FastAPI copie la valeur par défaut, la liste n'est pas partagée
"ged/web/app.py" = ["B006"]
# Les captures sont prises dans la boucle même : capturer() n'est jamais appelée après coup
"outils/demo/captures.py" = ["B023"]
