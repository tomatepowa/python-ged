# Taxonomie : tags proposés automatiquement à partir du contenu des documents.
#
# Format : "Libellé du tag" = ["mot-clé", "autre mot-clé", ...]
#   - la casse et les accents sont ignorés ("Identitovigilance" = "identitovigilance")
#   - un mot-clé est cherché en mot entier ("ad" ne trouve pas "admission")
#   - préfixe "titre:" : le mot-clé ne compte que dans le nom, le titre ou le chemin du fichier
#     (pour les mots trop courants dans un texte, comme "procédure" ou "identité")
#
# Un tag est posé si un mot-clé apparaît dans le nom / titre / chemin du fichier,
# ou s'il apparaît au moins `seuil` fois dans le texte, avec au moins `densite_min`
# mentions pour 1000 mots (un long document cite tout sans en parler vraiment).
#
# Après modification de ce fichier : `ged recalculer` (ne relit pas les fichiers).
#
# C'EST UN PREMIER JET À COMPLÉTER AVEC LES POLES (liste réelle des logiciels et secteurs).

seuil = 2
densite_min = 0.5

[logiciel]
"EasyVista" = ["easyvista", "easy vista"]
"Active Directory" = ["active directory", "controleur de domaine", "gpo"]
"Messagerie" = ["outlook", "exchange", "boite mail", "boite aux lettres"]
"Microsoft 365" = ["office 365", "microsoft 365", "teams", "onedrive", "sharepoint"]
"Impression" = ["imprimante", "imprimantes", "file d'impression", "spouleur", "copieur"]
"VPN" = ["vpn", "forticlient", "globalprotect"]
"Citrix" = ["citrix", "xenapp", "storefront"]
"VMware" = ["vmware", "vsphere", "vcenter", "esxi"]
"KeePass" = ["keepass"]
# Logiciels métier : à compléter, par exemple
# "Nom du DPI" = ["nom du dpi", "alias"]
# "Nom du logiciel de facturation" = ["..."]

[secteur]
"Identité" = ["identitovigilance", "identito", "doublon patient", "doublons patients", "identifiant national de sante", "titre:identite", "titre:ins", "titre:gam"]
"Soins" = ["dossier de soins", "plan de soins", "administration medicamenteuse", "dpi", "titre:soins"]
"Comptabilité / facturation" = ["facturation", "titre de recette", "pmsi", "t2a", "noemie", "titre:comptabilite", "titre:factu"]
"Pharmacie" = ["dispensation", "titre:pharmacie"]
"Laboratoire" = ["titre:laboratoire", "titre:biologie"]
"Imagerie" = ["pacs", "dicom", "titre:imagerie", "titre:radiologie"]
"Ressources humaines" = ["gestion des temps", "titre:paie", "titre:rh"]
"Infrastructure" = ["pare-feu", "vlan", "baie de stockage", "titre:serveur", "titre:reseau", "titre:sauvegarde"]

[type]
"Note technique" = ["note technique"]
"Procédure" = ["mode operatoire", "titre:procedure"]
"Debug utilisateur" = ["message d'erreur", "ne fonctionne pas", "depannage", "contournement", "titre:debug", "titre:incident"]
